<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="hatchery: an egg cracking open">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd76a"/>
      <stop offset="1" stop-color="#f6a93b"/>
    </radialGradient>
  </defs>
  <ellipse cx="80" cy="148" rx="38" ry="5" fill="#d9c9a8" opacity="0.6"/>
  <!-- light escaping through the crack -->
  <path d="M38 74 L50 66 L60 78 L72 64 L84 78 L96 64 L106 76 L122 68 L123 80 L106 88 L96 76 L84 90 L72 76 L60 90 L50 78 L37 86 Z" fill="url(#glow)"/>
  <!-- lower shell -->
  <path d="M37 86 L50 78 L60 90 L72 76 L84 90 L96 76 L106 88 L123 80
           C126 120 106 144 80 144 C54 144 34 120 37 86 Z"
        fill="#fbf4e4" stroke="#3b2f20" stroke-width="4" stroke-linejoin="round"/>
  <!-- upper shell, lifted slightly and tilted -->
  <g transform="rotate(-6 80 70) translate(0 -4)">
    <path d="M38 74 C38 38 58 14 80 14 C102 14 122 38 122 68 L106 76 L96 64 L84 78 L72 64 L60 78 L50 66 Z"
          fill="#fbf4e4" stroke="#3b2f20" stroke-width="4" stroke-linejoin="round"/>
    <path d="M60 32 C56 38 54 44 54 50" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
  </g>
  <!-- rays -->
  <g stroke="#f6a93b" stroke-width="4" stroke-linecap="round">
    <line x1="22" y1="68" x2="12" y2="62"/>
    <line x1="22" y1="82" x2="11" y2="84"/>
    <line x1="138" y1="64" x2="148" y2="56"/>
    <line x1="139" y1="78" x2="150" y2="79"/>
  </g>
</svg>
