# Creates a private project repo from hatchery-template.
# A session dispatches it over the REST API, then attaches the new repo with add_repo.
# Errors surface as annotations on the run, readable over the REST API.
# Needs Actions secret HATCHERY_PAT (SETUP.md, step 6).

name: create-project
run-name: create-project ${{ inputs.name }}

on:
  workflow_dispatch:
    inputs:
      name:
        description: Repo name. 1 to 32 characters, lowercase letters, digits and dashes.
        required: true
      description:
        description: One-line repo description.
        required: false
        default: ""
      template:
        description: Template repo in this account, or "none" for an empty repo.
        required: false
        default: hatchery-template
      is_template:
        description: Mark the repo as a template. Needs template "none". Also marks an existing repo.
        type: boolean
        default: false

permissions: {}

concurrency:
  group: create-project-${{ inputs.name }}

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.HATCHERY_PAT }}
      OWNER: ${{ github.repository_owner }}
      NAME: ${{ inputs.name }}
      DESCRIPTION: ${{ inputs.description }}
      TEMPLATE: ${{ inputs.template }}
      IS_TEMPLATE: ${{ inputs.is_template }}
    steps:
      - name: Create repo
        run: |
          fail() { echo "::error title=create-project::$1"; exit 1; }
          # why: gh's own last error line, such as "Resource not accessible by personal access token (HTTP 403)".
          api() { gh api "$@" 2>"$RUNNER_TEMP/gh.err"; }
          why() { tail -n 1 "$RUNNER_TEMP/gh.err"; }

          [ -n "$GH_TOKEN" ] || fail "Secret HATCHERY_PAT is not set on hatchery. See SETUP.md."
          api user >/dev/null || fail "HATCHERY_PAT is invalid or expired ($(why)). Replace it (SETUP.md)."

          # 32 characters leaves room for Preview names in the 63-character workers.dev label.
          printf '%s' "$NAME" | grep -Eq '^[a-z0-9]([a-z0-9-]{0,30}[a-z0-9])?$' \
            || fail "Invalid name '$NAME'. Use 1 to 32 lowercase letters, digits and dashes; no dash at either end."
          case "$NAME" in *--*) fail "Invalid name '$NAME'. No double dashes." ;; esac

          # Template repos: create if missing, then mark. The GitHub proxy blocks sessions from repo settings.
          if [ "$IS_TEMPLATE" = "true" ]; then
            [ "$TEMPLATE" = "none" ] || fail "is_template needs template \"none\"."
            api "repos/$OWNER/$NAME" >/dev/null \
              || api -X POST user/repos -f name="$NAME" -f description="$DESCRIPTION" -F private=true >/dev/null \
              || fail "Creating $OWNER/$NAME failed ($(why)). Check HATCHERY_PAT permissions (SETUP.md)."
            api -X PATCH "repos/$OWNER/$NAME" -F is_template=true >/dev/null \
              || fail "Marking $OWNER/$NAME as a template failed ($(why)). Check HATCHERY_PAT permissions (SETUP.md)."
            echo "::notice title=template::https://github.com/$OWNER/$NAME"
            exit 0
          fi

          if api "repos/$OWNER/$NAME" >/dev/null; then
            fail "Repo $OWNER/$NAME already exists. Pick another name."
          fi

          if [ "$TEMPLATE" = "none" ]; then
            api -X POST user/repos -f name="$NAME" -f description="$DESCRIPTION" -F private=true >/dev/null \
              || fail "Creating $OWNER/$NAME failed ($(why)). Check HATCHERY_PAT permissions (SETUP.md)."
          else
            api "repos/$OWNER/$TEMPLATE" --jq .is_template | grep -qx true \
              || fail "Template $OWNER/$TEMPLATE is missing, not a template repo, or not readable with HATCHERY_PAT."
            api -X POST "repos/$OWNER/$TEMPLATE/generate" \
              -f owner="$OWNER" -f name="$NAME" -f description="$DESCRIPTION" -F private=true >/dev/null \
              || fail "Generating $OWNER/$NAME from $TEMPLATE failed ($(why)). Check HATCHERY_PAT permissions (SETUP.md)."
            # Generation copies files in the background. Wait until main has a commit.
            for _ in $(seq 1 30); do
              api "repos/$OWNER/$NAME/commits?per_page=1" >/dev/null && break
              sleep 2
            done
            api "repos/$OWNER/$NAME/commits?per_page=1" >/dev/null \
              || fail "$OWNER/$NAME exists but has no commits after 60 seconds."
          fi

          echo "::notice title=created::https://github.com/$OWNER/$NAME"
          echo "Created [$OWNER/$NAME](https://github.com/$OWNER/$NAME) from \`$TEMPLATE\`." >> "$GITHUB_STEP_SUMMARY"
