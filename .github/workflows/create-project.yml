# Creates an empty private project repo with the topic "hatchery".
# A session dispatches it over the REST API, attaches the repo with add_repo, and pushes the
# first commit composed from recipes/. The topic marks hatchery projects: project-secret refuses
# any repo without it, and sessions cannot set topics, because the GitHub proxy blocks repo settings.
# Errors surface as annotations on the run, readable over the REST API.
# Needs Actions secret HATCHERY_PAT (SETUP.md, step 6).

name: create-project
run-name: create-project ${{ inputs.name }}

on:
  workflow_dispatch:
    inputs:
      name:
        description: Repo name. 1 to 32 characters, lowercase letters, digits and dashes.
        required: true
      description:
        description: One-line repo description.
        required: false
        default: ""

permissions: {}

concurrency:
  group: create-project-${{ inputs.name }}

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.HATCHERY_PAT }}
      OWNER: ${{ github.repository_owner }}
      NAME: ${{ inputs.name }}
      DESCRIPTION: ${{ inputs.description }}
    steps:
      - name: Create repo
        run: |
          fail() { echo "::error title=create-project::$1"; exit 1; }
          # why: gh's own last error line, such as "Resource not accessible by personal access token (HTTP 403)".
          api() { gh api "$@" 2>"$RUNNER_TEMP/gh.err"; }
          why() { tail -n 1 "$RUNNER_TEMP/gh.err"; }

          [ -n "$GH_TOKEN" ] || fail "Secret HATCHERY_PAT is not set on hatchery. See SETUP.md."
          api user >/dev/null || fail "HATCHERY_PAT is invalid or expired ($(why)). Replace it (SETUP.md)."

          # 32 characters leaves room for Preview names in the 63-character workers.dev label.
          printf '%s' "$NAME" | grep -Eq '^[a-z0-9]([a-z0-9-]{0,30}[a-z0-9])?$' \
            || fail "Invalid name '$NAME'. Use 1 to 32 lowercase letters, digits and dashes; no dash at either end."
          case "$NAME" in *--*) fail "Invalid name '$NAME'. No double dashes." ;; esac

          if api "repos/$OWNER/$NAME" >/dev/null; then
            fail "Repo $OWNER/$NAME already exists. Pick another name."
          fi

          api -X POST user/repos -f name="$NAME" -f description="$DESCRIPTION" -F private=true >/dev/null \
            || fail "Creating $OWNER/$NAME failed ($(why)). Check HATCHERY_PAT permissions (SETUP.md)."
          api -X PUT "repos/$OWNER/$NAME/topics" -f 'names[]=hatchery' >/dev/null \
            || fail "Created $OWNER/$NAME, but setting the topic hatchery failed ($(why)). Add it by hand under About > Topics."

          echo "::notice title=created::https://github.com/$OWNER/$NAME"
          echo "Created [$OWNER/$NAME](https://github.com/$OWNER/$NAME), empty, with the topic \`hatchery\`." >> "$GITHUB_STEP_SUMMARY"
