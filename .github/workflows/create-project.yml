# Creates a private project repo. Option B in TEST-PLAN.md.
# Triggers:
#   - workflow_dispatch with input `name` (session calls the REST API).
#   - push to branch `request/<name>` (fallback if dispatch is blocked).
# If the pushed branch contains export/<name>/, that folder becomes the new repo's main.
# Needs secret HATCHERY_PAT: a token that can create repos and push to them.

name: create-project

on:
  workflow_dispatch:
    inputs:
      name:
        description: Repo name (lowercase, digits, dashes)
        required: true
  push:
    branches: ["request/**"]

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.HATCHERY_PAT }}
      OWNER: ${{ github.repository_owner }}
      INPUT_NAME: ${{ inputs.name }}
      EVENT: ${{ github.event_name }}
      REF_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate name
        run: |
          if [ "$EVENT" = "push" ]; then NAME="${REF_NAME#request/}"; else NAME="$INPUT_NAME"; fi
          if ! printf '%s' "$NAME" | grep -Eq '^[a-z0-9][a-z0-9-]{0,62}$'; then
            echo "Invalid name: $NAME"; exit 1
          fi
          echo "NAME=$NAME" >> "$GITHUB_ENV"

      - name: Create repo if missing
        run: |
          if gh api "repos/$OWNER/$NAME" >/dev/null 2>&1; then
            echo "Repo exists: $OWNER/$NAME"
          else
            gh api -X POST user/repos -f name="$NAME" -F private=true >/dev/null
            echo "Created: $OWNER/$NAME"
          fi

      - name: Export folder to new repo
        if: hashFiles(format('export/{0}/**', env.NAME)) != ''
        run: |
          git config user.name "hatchery"
          git config user.email "hatchery@users.noreply.github.com"
          git subtree split --prefix="export/$NAME" -b export-branch
          git push "https://x-access-token:${GH_TOKEN}@github.com/$OWNER/$NAME.git" export-branch:main
          echo "Exported export/$NAME to $OWNER/$NAME main"
