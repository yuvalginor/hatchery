# Sets an Actions secret on a project repo. The GitHub proxy blocks sessions from Actions secrets.
# 1. Dispatch with repo and secret only. The run posts the repo's public key as a notice annotation.
# 2. Seal the value with scripts/seal-secret.py and dispatch again with key_id and sealed.
# The plaintext never leaves the session. Needs Actions secret HATCHERY_PAT (SETUP.md, step 6).

name: project-secret
run-name: project-secret ${{ inputs.repo }} ${{ inputs.secret }}

on:
  workflow_dispatch:
    inputs:
      repo:
        description: Project repo name in this account.
        required: true
      secret:
        description: Secret name, such as DATABASE_URL.
        required: true
      key_id:
        description: Public key id from step 1. Empty for step 1.
        required: false
        default: ""
      sealed:
        description: Base64 sealed value from scripts/seal-secret.py. Empty for step 1.
        required: false
        default: ""

permissions: {}

jobs:
  secret:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.HATCHERY_PAT }}
      OWNER: ${{ github.repository_owner }}
      THIS_REPO: ${{ github.event.repository.name }}
      REPO: ${{ inputs.repo }}
      SECRET: ${{ inputs.secret }}
      KEY_ID: ${{ inputs.key_id }}
      SEALED: ${{ inputs.sealed }}
    steps:
      - name: Set secret
        run: |
          fail() { echo "::error title=project-secret::$1"; exit 1; }

          [ -n "$GH_TOKEN" ] || fail "Secret HATCHERY_PAT is not set on hatchery. See SETUP.md."
          printf '%s' "$REPO" | grep -Eq '^[a-z0-9][a-z0-9-]{0,99}$' || fail "Invalid repo name '$REPO'."
          # Never let a session overwrite hatchery's own secrets, HATCHERY_PAT included.
          [ "$REPO" != "$THIS_REPO" ] || fail "Refusing to set secrets on $THIS_REPO."
          printf '%s' "$SECRET" | grep -Eq '^[A-Z_][A-Z0-9_]{0,99}$' || fail "Invalid secret name '$SECRET'. Use A-Z, 0-9 and _."
          case "$SECRET" in GITHUB_*) fail "Secret names cannot start with GITHUB_." ;; esac
          gh api "repos/$OWNER/$REPO" >/dev/null 2>&1 || fail "Repo $OWNER/$REPO not found or not readable with HATCHERY_PAT."

          if [ -z "$SEALED" ]; then
            KEY=$(gh api "repos/$OWNER/$REPO/actions/secrets/public-key" --jq '"key_id=\(.key_id) key=\(.key)"') \
              || fail "Reading the public key of $OWNER/$REPO failed. Check HATCHERY_PAT permissions (SETUP.md)."
            echo "::notice title=public-key::$KEY"
            exit 0
          fi

          [ -n "$KEY_ID" ] || fail "key_id is required with sealed."
          gh api -X PUT "repos/$OWNER/$REPO/actions/secrets/$SECRET" -f encrypted_value="$SEALED" -f key_id="$KEY_ID" >/dev/null \
            || fail "Setting $SECRET on $OWNER/$REPO failed. The key may have rotated: run step 1 again."
          echo "::notice title=secret-set::$SECRET on $OWNER/$REPO"
