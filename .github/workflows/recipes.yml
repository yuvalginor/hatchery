# Tests the recipes as projects get them: web alone, and the full stack.
# Runs only when recipes, the compose script or this file change, to save Actions minutes.

name: recipes

on:
  push:
    paths:
      - recipes/**
      - scripts/compose.sh
      - .github/workflows/recipes.yml

permissions:
  contents: read

concurrency:
  group: recipes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.stack }}
    strategy:
      fail-fast: false
      matrix:
        stack: [web, web web-storage pwa, web android]
    # Pinned: Playwright's system dependencies are tested against this image.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STACK: ${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: recipes/web/package-lock.json
      - name: Compose
        # STACK is unquoted on purpose: one recipe name per word.
        run: scripts/compose.sh "$RUNNER_TEMP/project" $STACK
      - name: Test
        working-directory: ${{ runner.temp }}/project
        run: |
          git init -q
          npm ci --no-audit --no-fund
          if [ -f scripts/android-deps.sh ]; then bash scripts/android-deps.sh; fi
          npx playwright install --with-deps chromium
          npm test
      # The android recipe also has to build: the web build into the app, then a debug APK of the Preview flavour.
      - uses: actions/setup-java@v5
        if: contains(matrix.stack, 'android')
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Android debug build
        if: contains(matrix.stack, 'android')
        working-directory: ${{ runner.temp }}/project
        run: |
          node scripts/android-icons.ts
          rm -rf dist/app && npx cap sync android
          cd android && ./gradlew assembleDebug -Ppreview --no-daemon
          ls -l app/build/outputs/apk/debug/
